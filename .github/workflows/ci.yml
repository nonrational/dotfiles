name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393
        with:
          version: v3.11.1
      - run: make check-editorconfig

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install PyYAML==6.0.2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make preflight

      - run: ./setup.sh --dry-run

      # The real Linux path, twice: the second run must find nothing to do.
      - if: runner.os == 'Linux'
        run: |
          export HOME="$(mktemp -d)"
          ./setup.sh
          ./setup.sh | tee second-run.log
          grep -q '^skip: deploy$' second-run.log

      # The macOS path needs brew and sudo; keep exercising the deploy engine alone.
      - if: runner.os == 'macOS'
        run: |
          export HOME="$(mktemp -d)"
          ./deploy.sh apply
          ./deploy.sh audit
