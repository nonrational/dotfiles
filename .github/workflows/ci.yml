name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: make test
      - run: |
          export HOME="$(mktemp -d)"
          ./deploy.sh apply
          ./deploy.sh audit
      - run: make check-copilot-instructions
      - run: make check-skills
      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c
        with:
          version: v3.11.1
      - run: make check-editorconfig
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: make check-skill-frontmatter
