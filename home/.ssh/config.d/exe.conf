# exe.dev VMs: the clipboard bridge and connection sharing.
#
# One-time: add `Include config.d/*.conf` as the FIRST line of ~/.ssh/config
# (relative Include paths resolve against ~/.ssh; an Include inside a Host block
# would be scoped to that block). ~/.ssh/config itself stays unmanaged.
#
# RemoteForward is the bridge: 127.0.0.1:2224 on the VM reaches the launch agent
# on 127.0.0.1:2224 here (org.nonrational.clipboard-bridge), which serves the
# pasteboard image to the VM's wl-paste shim for Claude Code's ctrl+v.
# ControlMaster + ControlPersist make every kitty window share one connection,
# so the forward is requested once and no second window warns "remote port
# forwarding failed"; new windows also open instantly. ServerAlive lets the
# master notice a dead VM within ~90s, so the next ssh builds a fresh master and
# a fresh forward instead of hanging on a stale one.
Host *.exe.xyz
  RemoteForward 127.0.0.1:2224 127.0.0.1:2224
  ExitOnForwardFailure no
  ControlMaster auto
  ControlPath ~/.ssh/cm-%C
  ControlPersist 4h
  ServerAliveInterval 30
  ServerAliveCountMax 3
