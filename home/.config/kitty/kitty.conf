# Migrated from iTerm2's "Default" profile (etc/iterm2-profiles.json) and
# the ir_black color scheme (etc/ir_black.itermcolors).

# Font
# Panic Sans (the old iTerm font) renders heavier in kitty than in iTerm.
# Mensch is a lighter-weight pick from the same era as ir_black; other
# candidates installed alongside it (see the `fonts` -> ~/Library/Fonts/dotfiles
# symlink) are listed below. Swap by editing font_family, or run
# `kitty +kitten choose-fonts` for a live preview that writes back here.
# font_family      Mensch
# font_family      Source Code Pro
# font_family      Meslo LG M
# font_family      Fantasque Sans Mono
# font_family      family='Atkinson Hyperlegible Mono' variable_name=AtkinsonHyperlegibleMono style=ExtraLight
# font_family      family="Panic Sans"
# Hack shares Panic Sans's Bitstream Vera lineage and adds Nerd Font icons
# (Brewfile: font-hack-nerd-font). The Mono variant keeps icons one cell wide.
font_family      family="Hack Nerd Font Mono"

font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# Cursor (iTerm: Cursor Type 2 = box, Blinking Cursor = false)
cursor_shape block
cursor_blink_interval 0
# kitty's shell integration switches the cursor to beam at shell prompts,
# overriding cursor_shape above — this keeps the rest of shell integration
# (cwd tracking, jump-to-prompt, etc.) but stops it touching the cursor.
shell_integration no-cursor

# Start fish in every window when it is installed. fish-shell.sh prints the
# `shell` line only if the Homebrew fish is executable, so a Mac without fish
# keeps kitty's default shell. The absolute path is deliberate: kitty launched
# from the Dock may not inherit the login shell's PATH (reason unverified), so a
# bare `fish` could fail to resolve. A direct path, not an `sh -c` wrapper,
# because kitty's docs say it detects the configured shell to inject fish
# integration, and a wrapper would hide fish from that detection.
geninclude fish-shell.sh

# Bell (iTerm: Silence Bell = true, Visual Bell = true, Flashing Bell = false)
enable_audio_bell no
visual_bell_duration 0.15

# Window (iTerm profile: Rows 30, Columns 120)
remember_window_size no
initial_window_width 120c
initial_window_height 30c

# iTerm Transparency 0.1387 == kitty opacity 1 - 0.1387
background_opacity 0.86
# Required for any runtime opacity change (the cmd+u toggle below).
dynamic_background_opacity yes

# kitty scrollback is in-memory per window; tmux keeps its own history on
# top, so this doesn't need to match iTerm's unlimited setting.
scrollback_lines 100000

# Colors: ir_black (etc/ir_black.itermcolors)
foreground            #f2f2f2
background            #000000
cursor                #ffa560
cursor_text_color     #f2f2f2
selection_foreground  #f2f2f2
selection_background  #553562

color0  #4e4e4e
color1  #ff6c60
color2  #a8ff60
color3  #ffffb6
color4  #96cbfe
color5  #ff73fd
color6  #c6c5fe
color7  #eeeeee
color8  #7c7c7c
color9  #ffb6b0
color10 #ceffab
color11 #ffffcb
color12 #cbcbff
color13 #ff9cfe
color14 #dfdffe
color15 #ffffff

# "Sharp" iTerm muscle-memory shortcuts: same key, more destructive action in
# kitty. iTerm's cmd+shift+d splits a pane (additive); kitty's default binds
# it to close_window, which closes the pane with no confirmation, ever.
# Restored here as an actual split, matching iTerm: cmd+d vertical, cmd+shift+d
# horizontal. vsplit/hsplit locations are only honored by the splits layout.
enabled_layouts splits
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# cmd+w: iTerm closes one pane; kitty's default (close_tab) closes every pane
# in the current tab, and won't even prompt if they're sitting idle at a
# shell prompt (confirm_os_window_close doesn't count those by default).
# Rebound to close_window so cmd+w still closes just the current pane, since
# tabs aren't in use here.
map cmd+w close_window
map cmd+right send_text all \x1b[F
map cmd+left send_text all \x1b[H

# kitty has no toggle action; the remote-control --toggle flag reverts to
# background_opacity when the requested value is already set.
map cmd+u remote_control set-background-opacity --toggle 1

# Option sends Esc+key so shell Alt bindings work (fish alt+e edits the line in
# $EDITOR; alt+arrows move by word). Costs the dead-key accents (opt+e gives
# ´), an accepted trade here; "left" would keep the right Option for typing.
macos_option_as_alt yes
