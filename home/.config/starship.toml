# Symbols are plain Unicode so the prompt needs no Nerd Font on any host.
add_newline = false
format = """
$hostname$directory$git_branch$git_status$cmd_duration
$sudo${env_var.AWS_SESSION_TOKEN}$character"""

[directory]
truncation_length = 3
fish_style_pwd_dir_length = 1
truncate_to_repo = false
style = "bold blue"
repo_root_style = "bold"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "blue"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "${count} "
diverged   = " ${ahead_count}${behind_count} "
behind     = "${count} "
conflicted = " "
untracked  = "? "
modified   = " "
up_to_date = ""
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[sudo]
disabled = false
symbol = "# "
style = "bold red"
format = "[$symbol]($style)"

# Session credentials outlive the command that loaded them, so flag any prompt
# where AWS calls would run as a real account. Never print the value.
[env_var.AWS_SESSION_TOKEN]
style = "bold yellow"
format = "[aws ]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
