# Old habits die hard. Use the Screen-style C-a prefix instead of tmux's default C-b.
set -g prefix C-a
# Press C-a twice to send a literal C-a to the application in the active pane.
bind C-a send-prefix

# Reuse prefix+r to reload this file and confirm that the reload completed.
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Start new panes and windows with the shell from the current environment.
set -g default-shell $SHELL

# Label every pane border with its index and title, with labels along the bottom.
# This makes panes easier to identify when a window contains several splits.
set -g pane-border-format "#{pane_index} #{pane_title}"
set -g pane-border-status bottom

# Let C-k clear the active pane's scrollback without requiring the tmux prefix.
bind -n C-k clear-history

# Move forward with prefix+n and backward with prefix+b.
# The repeat flag allows additional n or b presses without repeating the prefix.
bind -r n next-window
bind -r b previous-window

# Use vi keys for navigation and selection while in copy mode.
setw -g mode-keys vi

# Resize panes in five-cell steps with repeatable vi-direction keys.
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r l resize-pane -R 5

# Start a copy-mode selection with v, matching Vim's visual mode.
bind -T copy-mode-vi 'v' send -X begin-selection
# Define y as copy-and-exit; the macOS clipboard binding below supersedes it.
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Use Emacs editing keys, such as C-a and C-e, in tmux command prompts.
set -g status-keys emacs

# Make copy-mode exits explicit: Escape cancels, while y copies through pbcopy
# into the macOS clipboard and then returns to the active pane.
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi "y" send -X copy-pipe-and-cancel "pbcopy"

# Enable clicking panes and windows, dragging borders, and scrolling into copy mode.
set -g mouse on

# Use prefix+| for side-by-side panes and prefix+- for stacked panes.
# The key visually matches the divider created by each split.
bind | split-window -h
bind - split-window -v

# Number windows and panes from 1 so their indexes match the number-row keys.
set -g base-index 1
set -g pane-base-index 1

# Close gaps in window indexes after a window exits.
set -g renumber-windows on

# Retain up to 10,000 lines of scrollback in each pane.
set -g history-limit 10000

# Advertise 256-color support to applications running inside tmux.
set -g default-terminal "xterm-256color"
# Tell tmux that xterm-256color terminals also support 24-bit true color.
set -ga terminal-overrides ",xterm-256color:Tc"

# Keep the outer terminal title synchronized with tmux.
set -g set-titles on
# Show session, window, pane, and window-name context in the terminal title.
set -g set-titles-string '#S.#I.#P #W'

# Open new windows in the active pane's working directory instead of tmux's
# server directory.
bind c new-window -c "#{pane_current_path}"

# Open side-by-side or stacked panes with vi-inspired keys, preserving the
# active pane's working directory in each new pane.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Highlight the active pane border so the focused pane is easy to spot.
set -g pane-active-border-style fg=colour50

# Set the default foreground and background colors for the status bar.
set -g status-fg colour137
set -g status-bg colour237

# Give the active window entry a distinct background and brighter name.
# #I is the window index, #W its name, and #F its status flags.
setw -g window-status-current-format '#[fg=colour81,bg=colour238] #I#[fg=colour250] #[fg=colour255]#W#[fg=colour81]#F '

# Format inactive window entries with Seoul256-inspired colors.
setw -g window-status-format '#[fg=colour138,bg=colour237] #I #[fg=colour250]#W#[fg=colour244]#F '

# Refresh dynamic status-bar content every five seconds.
set -g status-interval 5
# Arrange window entries from the left edge of the status bar.
set -g status-justify left
# Leave the left status area empty.
set -g status-left ''
# Show the session name, date, and 24-hour time on the right.
set -g status-right '#[fg=colour215]#S #[fg=colour249,bg=colour240] %m/%d #[fg=colour240,bg=colour249] %H:%M '
# Cap the space available to the right and left status regions.
set -g status-right-length 50
set -g status-left-length 20

# Display an on-screen notice for activity in windows that monitor activity.
set -g visual-activity on
# Pass terminal focus changes to applications that respond to focus events.
set -g focus-events on

# Load machine-specific overrides when present without requiring this file to
# contain settings that should not be shared across machines.
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
